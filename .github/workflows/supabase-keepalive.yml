# Evita que Supabase (plan Free) pause el proyecto por inactividad.
# Supabase pausa despues de 7 dias sin actividad; este workflow consulta un endpoint
# publico del backend que lee la base de datos, dos veces por semana (lunes y jueves).
name: Supabase keepalive

on:
  schedule:
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

env:
  API_URL: https://wilson-futbol5-api.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Render (plan Free) tarda hasta ~1 minuto en despertar, por eso reintentamos.
      - name: Consultar disponibilidad (lee la base de datos)
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 30 --retry-all-errors --max-time 120 \
            "$API_URL/api/turnos/disponibilidad?fecha=$(date -u +%F)" > /dev/null
          echo "Backend y base de datos respondieron correctamente."

      # GitHub desactiva los workflows programados si el repo pasa 60 dias sin actividad.
      # Re-habilitar el workflow en cada corrida reinicia ese contador.
      - name: Mantener activo el workflow programado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
