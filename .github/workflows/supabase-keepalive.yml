# Evita que Supabase (plan Free) pause el proyecto por inactividad.
# Supabase pausa despues de 7 dias sin actividad; este workflow hace una consulta
# real a la base de datos dos veces por semana (lunes y jueves).
name: Supabase keepalive

on:
  schedule:
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Falta el secret SUPABASE_DB_URL" >&2
            exit 1
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -t -c \
            'SELECT now(), count(*) FROM "__EFMigrationsHistory";'

      # GitHub desactiva los workflows programados si el repo pasa 60 dias sin actividad.
      # Re-habilitar el workflow en cada corrida reinicia ese contador.
      - name: Mantener activo el workflow programado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
